name: Validate Plugin

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main]
  workflow_call:

jobs:
  validate:
    name: Validate Skills, Agents & Manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This workflow runs on pull_request and executes repo code
          # (distill.py via exec_module), so don't leave the token in git config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Validate plugin.json
        run: |
          python3 -c "
          import json, os, glob, sys
          repo_root = os.path.realpath(os.getcwd())
          errors = []
          manifests = sorted(glob.glob('plugins/*/.claude-plugin/plugin.json'))
          for manifest in manifests:
              plugin_src = os.path.realpath(os.path.dirname(os.path.dirname(manifest)))
              d = json.load(open(manifest))
              assert 'name' in d, f'{manifest}: missing name'
              assert isinstance(d.get('skills'), list), f'{manifest}: skills must be array'
              assert isinstance(d.get('agents'), list), f'{manifest}: agents must be array'
              for raw in d['skills']:
                  resolved = os.path.realpath(os.path.join(plugin_src, raw))
                  assert resolved.startswith(repo_root + os.sep), f'{manifest}: skill path escapes repo: {raw!r}'
                  assert os.path.exists(resolved), f'{manifest}: skill path not found: {raw!r}'
              for raw in d['agents']:
                  resolved = os.path.realpath(os.path.join(plugin_src, raw))
                  assert resolved.startswith(repo_root + os.sep), f'{manifest}: agent path escapes repo: {raw!r}'
                  assert os.path.exists(resolved), f'{manifest}: agent path not found: {raw!r}'
              print(f'OK: {manifest} — name={d[\"name\"]}, skills={len(d[\"skills\"])}, agents={len(d[\"agents\"])}')
          print(f'All {len(manifests)} plugin.json files validated')
          "

      - name: Validate marketplace.json
        run: |
          python3 -c "
          import json, os, sys
          d = json.load(open('.claude-plugin/marketplace.json'))
          repo_root = os.path.realpath(os.getcwd())
          errors = []
          for p in d.get('plugins', []):
              assert isinstance(p, dict)
              assert isinstance(p.get('name'), str) and p['name'].strip()
              src = p.get('source', '')
              source_dir = os.path.realpath(os.path.join(repo_root, src))
              assert source_dir.startswith(repo_root + os.sep), f'plugin {p[\"name\"]!r} source escapes repo: {src!r}'
              assert os.path.isdir(source_dir), f'plugin {p[\"name\"]!r} source not found: {src!r}'
              assert os.path.isfile(os.path.join(source_dir, '.claude-plugin', 'plugin.json')), f'plugin {p[\"name\"]!r}: no .claude-plugin/plugin.json at source: {src!r}'
              for raw in p.get('skills', []):
                  resolved = os.path.realpath(os.path.join(source_dir, raw))
                  assert resolved.startswith(repo_root + os.sep), f'skill path escapes repo: {raw!r}'
                  assert os.path.isdir(resolved), f'skill path not a dir in {p[\"name\"]!r}: {raw!r}'
              for raw in p.get('agents', []):
                  resolved = os.path.realpath(os.path.join(source_dir, raw))
                  assert resolved.startswith(repo_root + os.sep), f'agent path escapes repo: {raw!r}'
                  assert os.path.isfile(resolved), f'agent path not a file in {p[\"name\"]!r}: {raw!r}'
          n = len(d.get('plugins', []))
          print(f'marketplace.json OK — {n} plugins, all paths verified')
          "

      - name: Validate all SKILL.md files
        run: |
          python3 << 'PYEOF'
          import os, sys, glob
          paths = sorted(glob.glob("plugins/*/skills/*/SKILL.md"))
          required_sections = ["## Purpose", "## Domain Rules", "## QoR Metrics", "## Output Required"]
          errors = []
          for path in paths:
              content = open(path).read()
              if not content.startswith("---"):
                  errors.append(f"{path}: no YAML frontmatter")
              for section in required_sections:
                  if section not in content:
                      errors.append(f"{path}: missing section '{section}'")
              print(f"OK: {path} ({len(content.splitlines())} lines)")
          if errors:
              for e in errors: print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print(f"All {len(paths)} skill files validated")
          PYEOF

      - name: Validate all agent .md files
        run: |
          python3 << 'PYEOF'
          import os, sys, glob
          paths = sorted(glob.glob("plugins/*/agents/*.md"))
          required_fields = ["name:", "description:", "model:", "effort:", "maxTurns:"]
          errors = []
          for path in paths:
              content = open(path).read()
              if not content.startswith("---"):
                  errors.append(f"{path}: no YAML frontmatter")
              for field in required_fields:
                  if field not in content:
                      errors.append(f"{path}: missing frontmatter field '{field}'")
              if "## Stage Sequence" not in content:
                  errors.append(f"{path}: missing '## Stage Sequence' section")
              if "## Loop-Back Rules" not in content:
                  errors.append(f"{path}: missing '## Loop-Back Rules' section")
              # Anchor for the shared sections synced by tools/sync_agent_sections.py.
              if "## Behaviour Rules" not in content:
                  errors.append(f"{path}: missing '## Behaviour Rules' section")
              print(f"OK: {path} ({len(content.splitlines())} lines)")
          if errors:
              for e in errors: print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print(f"All {len(paths)} agent files validated")
          PYEOF

      - name: Check shared orchestrator sections are in sync
        run: python3 tools/sync_agent_sections.py --check

      - name: Check skill count matches marketplace registrations
        run: |
          python3 << 'PYEOF'
          import json, glob
          skill_count = len(glob.glob("plugins/*/skills/*/SKILL.md"))
          agent_count = len(glob.glob("plugins/*/agents/*.md"))
          mp = json.load(open(".claude-plugin/marketplace.json"))
          mp_count = len(mp.get("plugins", []))
          print(f"Skills: {skill_count} | Agents: {agent_count} | Marketplace entries: {mp_count}")
          # Agents and marketplace entries must be 1:1 (one orchestrator per plugin).
          # Skills may exceed plugins — a plugin can register more than one skill file
          # (e.g. chip-design-infrastructure registers both 'infrastructure' and 'memory-keeper').
          assert agent_count == mp_count == 16, \
              f"Count mismatch — expected 16 agents and 16 marketplace entries: agents={agent_count}, marketplace={mp_count}"
          assert skill_count >= mp_count, \
              f"Fewer skills than plugins — each plugin must have at least one skill: skills={skill_count}, plugins={mp_count}"
          print("Count check PASSED")
          PYEOF

      - name: Install schema validator
        run: pip install --quiet "jsonschema==4.23.0"

      - name: Validate design_state.json against schema
        run: |
          # The machine-readable contract lives in docs/design_state.schema.json
          # (enums, required fields, and the failure_class -> retry_strategy map are
          # all encoded there). Valid fixtures must pass; negative fixtures under
          # examples/invalid/ must be rejected.
          python3 << 'PYEOF'
          import json, glob, sys
          from jsonschema import Draft202012Validator

          schema = json.load(open("docs/design_state.schema.json"))
          Draft202012Validator.check_schema(schema)
          validator = Draft202012Validator(schema)
          base = "plugins/meta/skills/pipeline-orchestration/examples"
          rc = 0

          # Discover every fixture under examples/ except the negative ones in invalid/,
          # so new positive fixtures are validated automatically. Deterministic order.
          all_fixtures = sorted(glob.glob(f"{base}/**/*.json", recursive=True))
          valid_fixtures = [p for p in all_fixtures if f"{base}/invalid/" not in p]
          assert valid_fixtures, "expected at least one valid fixture under examples/"
          for path in valid_fixtures:
              errs = sorted(validator.iter_errors(json.load(open(path))),
                            key=lambda e: list(e.path))
              if errs:
                  rc = 1
                  for e in errs:
                      loc = "/".join(map(str, e.path)) or "<root>"
                      print(f"ERROR: {path}: {loc}: {e.message}", file=sys.stderr)
              else:
                  print(f"OK (valid):    {path}")

          negative_fixtures = sorted(glob.glob(f"{base}/invalid/*.json"))
          assert negative_fixtures, "expected at least one negative fixture under examples/invalid/"
          for path in negative_fixtures:
              errs = list(validator.iter_errors(json.load(open(path))))
              if errs:
                  print(f"OK (rejected): {path} — {len(errs)} schema error(s) as expected")
              else:
                  rc = 1
                  print(f"ERROR: {path}: expected schema rejection but it validated clean",
                        file=sys.stderr)

          sys.exit(rc)
          PYEOF

      - name: Validate IDE config files
        run: |
          python3 << 'PYEOF'
          import json, os, sys

          errors = []

          # applyto-map.json must cover exactly the domains that exist under plugins/.
          # bin/install.mjs builds Copilot instructions by iterating listSkills() and
          # looking up applyMap[domain], falling back to "**/*" for any domain missing
          # here — so a mistyped or stale key silently mis-scopes instructions to every
          # file. Derive the expected key set from the same source the installer uses
          # (the skill inventory) rather than hardcoding a count.
          import glob
          expected_domains = {p.split(os.sep)[1] for p in glob.glob("plugins/*/skills/*/SKILL.md")}
          applyto_path = "ides/copilot/applyto-map.json"
          if not os.path.isfile(applyto_path):
              errors.append(f"Missing: {applyto_path}")
          else:
              applyto = json.load(open(applyto_path))
              if len(applyto) != 16:
                  errors.append(f"{applyto_path}: expected 16 domains, got {len(applyto)}")
              missing = sorted(expected_domains - set(applyto))
              unexpected = sorted(set(applyto) - expected_domains)
              if missing:
                  errors.append(f"{applyto_path}: missing domain key(s): {missing}")
              if unexpected:
                  errors.append(f"{applyto_path}: unknown domain key(s): {unexpected}")
              if not missing and not unexpected and len(applyto) == 16:
                  print(f"OK: {applyto_path} — {len(applyto)} domains, keys match plugins/")

          # copilot-instructions.md must exist
          cpi_path = "ides/copilot/.github/copilot-instructions.md"
          if not os.path.isfile(cpi_path):
              errors.append(f"Missing: {cpi_path}")
          else:
              print(f"OK: {cpi_path}")

          # gemini-header.md must exist and be non-empty
          gh_path = "ides/gemini/gemini-header.md"
          if not os.path.isfile(gh_path):
              errors.append(f"Missing: {gh_path}")
          elif os.path.getsize(gh_path) == 0:
              errors.append(f"{gh_path}: file is empty")
          else:
              print(f"OK: {gh_path}")

          # opencode-base.json must be valid JSON with model field
          ob_path = "ides/opencode/opencode-base.json"
          if not os.path.isfile(ob_path):
              errors.append(f"Missing: {ob_path}")
          else:
              base = json.load(open(ob_path))
              if "model" not in base:
                  errors.append(f"{ob_path}: missing 'model' field")
              else:
                  print(f"OK: {ob_path} — model={base['model']}")

          # ides/codex/AGENTS.md must exist and be non-empty
          codex_path = "ides/codex/AGENTS.md"
          if not os.path.isfile(codex_path):
              errors.append(f"Missing: {codex_path}")
          elif os.path.getsize(codex_path) == 0:
              errors.append(f"{codex_path}: file is empty")
          else:
              print(f"OK: {codex_path}")

          if errors:
              for e in errors: print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("IDE config files OK")
          PYEOF

      - name: Validate infrastructure memory integration
        run: |
          python3 << 'PYEOF'
          import os, sys, importlib.util
          errors = []

          # Seeded Tier-2 knowledge file must exist (experiences.jsonl is created on first run)
          kb = "memory/infrastructure/knowledge.md"
          if not os.path.isfile(kb):
              errors.append(f"Missing: {kb}")
          elif os.path.getsize(kb) == 0:
              errors.append(f"{kb}: file is empty")
          else:
              print(f"OK: {kb}")

          # distill.py must register the infrastructure domain
          distill_path = "plugins/infrastructure/skills/memory-keeper/distill.py"
          if not os.path.isfile(distill_path):
              errors.append(f"Missing: {distill_path}")
          else:
              spec = importlib.util.spec_from_file_location("distill", distill_path)
              mod = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(mod)
              if "infrastructure" not in mod.VALID_DOMAINS:
                  errors.append("distill.py VALID_DOMAINS missing 'infrastructure'")
              elif "infrastructure" not in mod.METRIC_FIELDS:
                  errors.append("distill.py METRIC_FIELDS missing 'infrastructure'")
              else:
                  print(f"OK: distill.py registers infrastructure ({mod.METRIC_FIELDS['infrastructure']})")

          if errors:
              for e in errors: print(f"ERROR: {e}", file=sys.stderr)
              sys.exit(1)
          print("Infrastructure memory integration OK")
          PYEOF

  tests:
    name: Python tool tests (pytest)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # This job executes repo code (the tool scripts under test), so don't
          # leave the token in git config.
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: pip install --quiet "pytest==8.3.4"

      - name: Run pytest
        run: python3 -m pytest tests/ -q
