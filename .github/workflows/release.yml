name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    name: Full Validation
    uses: ./.github/workflows/validate.yml

  release:
    name: Tag and Release
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Stamp version into plugin.json
        run: |
          python3 -c "
          import json, os, glob
          tag = os.environ['VERSION'].lstrip('v')
          paths = sorted(glob.glob('plugins/*/.claude-plugin/plugin.json'))
          for path in paths:
              d = json.load(open(path))
              d['version'] = tag
              json.dump(d, open(path, 'w'), indent=2)
          print(f'Stamped version {tag} into {len(paths)} plugin.json files')
          "
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Build release archive
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          ARCHIVE="${RUNNER_TEMP}/digital-chip-design-agents-${VERSION}.tar.gz"
          # Write the archive outside the repo workspace so tar never sees its
          # own output file appear inside the directory it is reading (which
          # triggers "tar: .: file changed as we read it" and an exit-1 failure).
          tar -czf "$ARCHIVE" \
            --exclude='.git' \
            --exclude='*.tar.gz' \
            .
          echo "ARCHIVE=$ARCHIVE" >> "$GITHUB_OUTPUT"
          echo "Archive: $ARCHIVE"
          ls -lh "$ARCHIVE"

      - name: Generate release notes
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          SKILLS=$(find plugins -name "SKILL.md" | wc -l | tr -d ' ')
          AGENTS=$(find plugins -path "*/agents/*.md" | wc -l | tr -d ' ')
          cat << EOF > release_notes.md
          ## digital-chip-design-agents ${VERSION}

          A complete Claude Code marketplace plugin for digital chip design —
          from architecture specification through tape-out and firmware.

          ### Install
          \`\`\`
          /plugin marketplace add github:chuanseng-ng/digital-chip-design-agents
          \`\`\`
          Then install any domain:
          \`\`\`
          /plugin install chip-design-pd@digital-chip-design-agents
          /plugin install chip-design-rtl@digital-chip-design-agents
          \`\`\`

          ### Contents
          - **${SKILLS}** skill files across 14 chip design domains
          - **${AGENTS}** orchestrator agent definitions
          - Full CI validation on every PR

          ### Domains
          Architecture · RTL Design · Functional Verification · Formal Verification ·
          Logic Synthesis · DFT · STA · HLS · Physical Design · SoC Integration ·
          Memory IP Design · Compiler Toolchain · Embedded Firmware · FPGA Emulation

          ### Other IDE Support
          The same domain knowledge is available for non-Claude IDEs via the install script:
          - **GitHub Copilot**: \`bash install.sh --ide copilot\`
          - **Gemini Code Assist**: \`bash install.sh --ide gemini\`
          - **OpenCode**: \`bash install.sh --ide opencode\` (use \`/mode chip-<domain>\`)

          See CHANGELOG.md for full details.
          EOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: ${{ steps.archive.outputs.ARCHIVE }}
          body_path: release_notes.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, 'rc') || contains(steps.version.outputs.VERSION, 'beta') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: validate
    # Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN required.
    # id-token: write lets npm exchange the GitHub OIDC token for publish access.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The publish job only reads, stamps locally, and runs `npm publish` —
          # it never pushes to git, so the GITHUB_TOKEN need not be persisted.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          # This privileged (id-token: write) job only publishes; disable
          # setup-node's automatic dependency cache to avoid cache poisoning.
          package-manager-cache: false

      - name: Upgrade npm for trusted publishing (OIDC)
        # Trusted publishing requires npm >= 11.5.1 on Node >= 22.14.0.
        run: npm install -g npm@^11.5.1

      - name: Extract version
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Stamp tag version into package.json and manifests
        run: |
          node -e "
          const fs = require('fs');
          const tag = process.env.VERSION.replace(/^v/, '');
          const stamp = (p, mut) => { const d = JSON.parse(fs.readFileSync(p)); mut(d); fs.writeFileSync(p, JSON.stringify(d, null, 2) + '\n'); };
          stamp('package.json', d => d.version = tag);
          stamp('.claude-plugin/marketplace.json', d => d.metadata.version = tag);
          for (const dir of fs.readdirSync('plugins')) {
            const p = 'plugins/' + dir + '/.claude-plugin/plugin.json';
            if (fs.existsSync(p)) stamp(p, d => d.version = tag);
          }
          console.log('Stamped version ' + tag);
          "
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}

      - name: Publish to npm
        env:
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          # Prerelease tags (rc/beta) publish under the "next" dist-tag so they
          # never overwrite "latest". Mirrors the prerelease check on the
          # Create GitHub Release step.
          TAG=latest
          case "$VERSION" in
            *rc*|*beta*) TAG=next ;;
          esac
          npm publish --access public --tag "$TAG"
